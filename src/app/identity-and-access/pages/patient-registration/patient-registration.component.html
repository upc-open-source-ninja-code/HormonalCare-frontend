<form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" formControlName="username" class="form-control" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" formControlName="password" class="form-control" />
  </div>
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" formControlName="firstName" class="form-control" />
  </div>
  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" formControlName="lastName" class="form-control" />
  </div>
  <div class="form-group">
    <label for="gender">Gender</label>
    <input type="text" id="gender" formControlName="gender" class="form-control" />
  </div>
  <div class="form-group">
    <label for="phoneNumber">Phone Number</label>
    <input type="text" id="phoneNumber" formControlName="phoneNumber" class="form-control" />
  </div>
  <div class="form-group">
    <label for="image">Image</label>
    <input type="text" id="image" formControlName="image" class="form-control" />
  </div>
  <div class="form-group">
    <label for="birthday">Birthday</label>
    <input type="date" id="birthday" formControlName="birthday" class="form-control" />
  </div>
  <div class="form-group">
    <label for="typeOfBlood">Type of Blood</label>
    <input type="text" id="typeOfBlood" formControlName="typeOfBlood" class="form-control" />
  </div>
  <div class="form-group">
    <label for="doctorId">Doctor ID</label>
    <input type="text" id="doctorId" formControlName="doctorId" class="form-control" />
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>
